version: 1
applications:
    -
        frontend:
            phases:
                preBuild:
                    commands:
                      - 'nvm install 24.16.0'
                      - 'nvm use 24.16.0'
                      - 'node -v'
                      - 'npm install'
                build:
                    commands: ['npm run build']
            artifacts:
                baseDirectory: dist/Frontend/browser
                files:
                    - '**/*'
            cache:
                paths:
                    - 'node_modules/**/*'
        appRoot: frontend/code
