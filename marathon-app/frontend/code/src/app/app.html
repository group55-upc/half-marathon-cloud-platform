<header class="app-header">
  <div class="nav-container">
    <a routerLink="/dashboard" class="logo-area">
      <span class="logo-icon"></span>
      <h1 class="app-title">MarathonCloud</h1>
    </a>

    <nav class="app-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link" id="nav-dashboard">
        Dashboard
      </a>
      <a routerLink="/add-race" routerLinkActive="active" class="nav-link" id="nav-add-race">
        Register Race
      </a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/notifications" routerLinkActive="active" class="nav-link" id="nav-notifications">
          Notifications
        </a>
      }
    </nav>

    <div class="api-status-area">
      <button (click)="checkApiHealth()" class="status-badge" [class.online]="isBackendHealthy() === true" [class.offline]="isBackendHealthy() === false" [class.checking]="isBackendHealthy() === null" title="Click to refresh connection status">
        <span class="status-dot"></span>
        <span class="status-text">
          @if (isBackendHealthy() === true) {
            Service Online
          } @else if (isBackendHealthy() === false) {
            Service Offline
          } @else {
            Checking Service...
          }
        </span>
      </button>

      @if (auth.isLoggedIn()) {
        <span class="nav-user">{{ auth.username() }}</span>
        <button type="button" (click)="logout()" class="nav-link nav-button" id="nav-logout">
          Log Out
        </button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="nav-link" id="nav-login">
          Log In
        </a>
        <a routerLink="/signup" routerLinkActive="active" class="nav-link" id="nav-signup">
          Sign Up
        </a>
      }
    </div>
  </div>
</header>

<main class="app-main-content">
  <div class="app-container">
    <router-outlet></router-outlet>
  </div>
</main>

<footer class="app-footer">
  <div class="footer-container">
    <p>&copy; 2026 MarathonCloud</p>
  </div>
</footer>
