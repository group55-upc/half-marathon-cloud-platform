<div class="race-view-container">
  <a routerLink="/dashboard" class="back-link" id="back-link">
    <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
      <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z"/>
    </svg>
    Back to Dashboard
  </a>

  <div *ngIf="isLoading()" class="loading-state">
    <div class="spinner"></div>
    <p>Loading race details...</p>
  </div>

  <div *ngIf="errorMsg()" class="error-state">
    <svg xmlns="http://www.w3.org/2000/svg" height="40" viewBox="0 -960 960 960" width="40" fill="currentColor">
      <path d="M480-280q17 0 28.5-11.5T520-320q0-17-11.5-28.5T480-360q-17 0-28.5 11.5T440-320q0 17 11.5 28.5T480-280Zm-40-160h80v-240h-80v240Zm40 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>
    </svg>
    <p>{{ errorMsg() }}</p>
  </div>

  <div *ngIf="!isLoading() && !errorMsg() && race() as r" class="race-detail-card">
    <div class="race-detail-header">
      <h1 class="race-name">{{ r.name }}</h1>
      <span class="distance-badge" [class.badge-marathon]="r.distance >= 42" [class.badge-half]="r.distance >= 21 && r.distance < 42" [class.badge-10k]="r.distance < 21">
        {{ r.distance }} km
      </span>
    </div>

    <div class="race-meta">
      <span class="race-date">
        <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 -960 960 960" width="16" fill="currentColor">
          <path d="M200-80q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Z"/>
        </svg>
        {{ r.date | date:'fullDate' }}
      </span>
      <span class="race-location">
        <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 -960 960 960" width="16" fill="currentColor">
          <path d="M480-480q33 0 56.5-23.5T560-560q0-33-23.5-56.5T480-640q-33 0-56.5 23.5T400-560q0 33 23.5 56.5T480-480Zm0 294q122-112 181-203.5T720-552q0-109-75.5-184.5T480-812q-109 0-184.5 75.5T220-552q0 71 59 162.5T480-186Zm0 106Q319-215 239.5-326T160-552q0-150 101-249t219-99q118 0 219 99t101 249q0 116-79.5 226T480-80Zm0-472Z"/>
        </svg>
        <span>{{ r.city }}, {{ r.country }}</span>
      </span>
    </div>

    <a [href]="r.web" target="_blank" rel="noopener" class="btn btn-primary visit-link" id="visit-event-link">
      Visit Event Website
      <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 -960 960 960" width="16" fill="currentColor">
        <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h560v-280h80v280q0 33-23.5 56.5T760-120H200Zm188-212-56-56 372-372H560v-80h280v280h-80v-144L388-332Z"/>
      </svg>
    </a>

    <div class="track-section" *ngIf="r.trackUrl">
      <h2 class="section-title">Race Route</h2>

      <div class="map-wrapper">
        <div #mapContainer class="map-container" id="route-map"></div>
        <div *ngIf="isMapLoading()" class="map-overlay">
          <div class="spinner"></div>
        </div>
        <div *ngIf="mapError()" class="map-overlay map-overlay-error">
          <p>{{ mapError() }}</p>
        </div>
      </div>

      <a [href]="r.trackUrl" target="_blank" rel="noopener" class="btn btn-secondary track-link" id="track-link">
        <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
          <path d="M480-320 280-520l56-56 104 104v-328h80v328l104-104 56 56-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/>
        </svg>
        Download Route
        <span class="track-type-badge" *ngIf="r.trackType">{{ r.trackType.toUpperCase() }}</span>
      </a>
    </div>
  </div>
</div>
