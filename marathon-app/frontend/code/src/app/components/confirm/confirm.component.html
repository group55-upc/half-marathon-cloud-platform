<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h2>Confirm Account</h2>
      <p>Enter the code we sent to your email</p>
    </div>

    @if (errorMsg()) {
      <div class="alert alert-danger animate-fade-in">
        <div><strong>Error!</strong> {{ errorMsg() }}</div>
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" [(ngModel)]="username"
               class="form-control" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="code">Confirmation code</label>
        <input type="text" id="code" name="code" [(ngModel)]="code"
               class="form-control" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
      </div>

      <div class="form-actions">
        <a routerLink="/login" class="btn btn-link">Back to log in</a>
        <button type="submit" class="btn btn-primary submit-btn" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Confirming...' : 'Confirm' }}
        </button>
      </div>
    </form>
  </div>
</div>
